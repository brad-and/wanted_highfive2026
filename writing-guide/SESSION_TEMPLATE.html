<title><!-- [세션명] · AWS Summit Seoul 2026 --></title>
<style>
  /* ── DESIGN SYSTEM ─────────────────────────────────────────────────────── */
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap');

  :root {
    --bg-base:     #121212;
    --bg-surface:  #181818;
    --bg-elevated: #1f1f1f;
    --bg-card:     #252525;

    --green:    #1ed760;
    --green-dim:#1db954;
    --orange:   #ffa42b;   /* jenny.by */
    --blue:     #539df5;   /* brad.and */
    --pink:     #f3727f;   /* ayyan.jm */
    --purple:   #b39ddb;   /* daniel.007 */
    --teal:     #4ecdc4;   /* zero.002 */
    --yellow:   #f5c842;
    --red:      #f3727f;
    --aws:      #FF9900;   /* AWS 오렌지 */

    --text-primary:   #ffffff;
    --text-secondary: #b3b3b3;
    --text-muted:     #6a6a6a;
    --border:         #2a2a2a;

    --shadow-card: rgba(0,0,0,0.5) 0px 8px 24px;
    --shadow-sm:   rgba(0,0,0,0.3) 0px 4px 8px;
    --radius:      8px;
    --radius-pill: 9999px;
  }

  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg-base); color: var(--text-primary);
    font-family: 'Noto Sans KR','Helvetica Neue',Helvetica,Arial,sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 0 32px; }

  /* ── NAV ──────────────────────────────────────────────────────────────── */
  nav {
    position: sticky; top: 0; z-index: 100;
    background: rgba(18,18,18,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 14px 32px; display: flex; align-items: center; gap: 8px;
  }
  .nav-back    { font-size: 13px; color: var(--text-secondary); text-decoration: none; transition: color .2s; }
  .nav-back:hover { color: var(--text-primary); }
  .nav-sep     { color: #3a3a3a; font-size: 14px; }
  .nav-current { font-size: 13px; color: var(--text-secondary); }
  .nav-pill    {
    margin-left: auto; background: var(--bg-elevated); color: var(--text-secondary);
    font-size: 12px; font-weight: 600; padding: 5px 14px;
    border-radius: var(--radius-pill); letter-spacing: 0.08em; text-transform: uppercase;
  }

  /* ── HERO ─────────────────────────────────────────────────────────────── */
  .hero {
    position: relative; padding: 100px 0 80px;
    border-bottom: 1px solid var(--border);
    overflow: hidden; min-height: 520px; background: #121212;
  }
  .hero-bg { position: absolute; inset: 0; z-index: 0; }
  .hero-bg img {
    position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    height: calc(100% + 80px); width: auto; max-width: none;
    filter: brightness(0.28) saturate(0.5);
  }
  .hero-bg::after {
    content: ''; position: absolute; inset: 0;
    background:
      linear-gradient(to right, #121212 0%, #121212 30%, rgba(18,18,18,0.75) 55%, rgba(18,18,18,0.2) 100%),
      linear-gradient(to bottom, rgba(18,18,18,0.2) 0%, transparent 30%, transparent 70%, #121212 100%);
  }
  .hero > .container { position: relative; z-index: 1; }
  .hero-eyebrow { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; flex-wrap: wrap; }
  .hero h1 {
    font-size: clamp(26px, 4vw, 48px); font-weight: 700;
    line-height: 1.15; letter-spacing: -0.03em; margin-bottom: 16px;
  }
  .hero h1 .accent { color: var(--aws); }
  .hero-desc { font-size: 15px; color: var(--text-secondary); max-width: 560px; line-height: 1.7; margin-bottom: 36px; }
  .hero-meta-row { display: flex; flex-wrap: wrap; gap: 32px; }
  .hero-meta-item .label { font-size: 11px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .hero-meta-item .value { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-top: 2px; }

  /* ── BADGES ───────────────────────────────────────────────────────────── */
  .badge {
    background: var(--aws); color: #000;
    font-size: 11px; font-weight: 700; padding: 4px 12px;
    border-radius: var(--radius-pill); letter-spacing: 0.1em; text-transform: uppercase;
  }
  .badge-outline {
    background: rgba(255,255,255,0.08); color: var(--text-secondary);
    border: 1px solid rgba(255,255,255,0.15);
    font-size: 11px; font-weight: 600; padding: 4px 12px;
    border-radius: var(--radius-pill); letter-spacing: 0.08em;
  }
  .badge-attendee {
    font-size: 11px; font-weight: 700; padding: 4px 12px;
    border-radius: var(--radius-pill); letter-spacing: 0.06em;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .badge-attendee::before { content:''; display:inline-block; width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .badge-attendee.daniel { background: rgba(179,157,219,0.18); color: var(--purple); border: 1px solid rgba(179,157,219,0.4); }
  .badge-attendee.daniel::before { background: var(--purple); }
  .badge-attendee.zero   { background: rgba(78,205,196,0.18);  color: var(--teal);   border: 1px solid rgba(78,205,196,0.4); }
  .badge-attendee.zero::before   { background: var(--teal); }

  /* ── STATS STRIP ──────────────────────────────────────────────────────── */
  .stats-strip {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 1px; background: var(--border);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .stat-cell { background: var(--bg-base); padding: 28px 32px; display: flex; flex-direction: column; gap: 4px; }
  .stat-cell .number { font-size: 30px; font-weight: 700; color: var(--aws); line-height: 1; }
  .stat-cell .desc   { font-size: 12px; color: var(--text-secondary); }

  /* ── SECTIONS ─────────────────────────────────────────────────────────── */
  section { padding: 64px 0; }
  .section-label { font-size: 11px; font-weight: 700; color: var(--aws); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 8px; }
  .section-title { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
  .section-sub   { font-size: 14px; color: var(--text-secondary); margin-bottom: 40px; line-height: 1.7; }
  .border-top    { border-top: 1px solid var(--border); }

  /* ── PROBLEM CARDS (Before/After) ─────────────────────────────────────── */
  .problem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  .problem-card { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; }
  .problem-card.before { border-top: 3px solid var(--red); }
  .problem-card.after  { border-top: 3px solid var(--green); }
  .problem-card .tag   { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }
  .problem-card.before .tag { color: var(--red); }
  .problem-card.after  .tag { color: var(--green); }
  .problem-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .problem-card p  { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }

  /* ── INSIGHT BOX ──────────────────────────────────────────────────────── */
  .insight-box {
    background: var(--bg-surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 32px 36px;
    display: flex; gap: 48px; align-items: center; flex-wrap: wrap;
  }
  .insight-box .big-num   { font-size: 52px; font-weight: 700; color: var(--aws); line-height: 1; }
  .insight-box .big-label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
  .insight-box .divider   { width: 1px; background: var(--border); align-self: stretch; min-height: 60px; }
  .insight-box .conclusion { font-size: 15px; font-weight: 600; line-height: 1.6; max-width: 420px; }
  .insight-box .conclusion span { color: var(--aws); }

  /* ── REACTION / QUOTE BOX ─────────────────────────────────────────────── */
  .reaction-box {
    background: var(--bg-surface); border-left: 3px solid var(--aws);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 24px 28px; margin: 24px 0;
  }
  .reaction-text { font-size: 18px; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
  .reaction-sub  { font-size: 13px; color: var(--text-muted); }

  /* ── NUMBERED LIST ────────────────────────────────────────────────────── */
  .obstacle-list { display: flex; flex-direction: column; gap: 16px; margin: 24px 0; }
  .obstacle-item { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 24px; }
  .obstacle-num  { font-size: 12px; font-weight: 700; color: var(--aws); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; }
  .obstacle-item p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }

  /* ── INLINE SLIDE PHOTO ───────────────────────────────────────────────── */
  .slide-inline     { margin: 24px 0; border-radius: var(--radius); overflow: hidden; background: var(--bg-surface); }
  .slide-inline img { width: 100%; display: block; }
  .slide-inline-cap { font-size: 12px; color: var(--text-muted); padding: 10px 16px; }

  /* ── PHOTO GRID ───────────────────────────────────────────────────────── */
  .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; margin: 24px 0; }
  .photo-item { border-radius: var(--radius); overflow: hidden; background: var(--bg-surface); }
  .photo-item img { width: 100%; display: block; aspect-ratio: 4/3; object-fit: cover; }
  .photo-item-cap { font-size: 12px; color: var(--text-muted); padding: 8px 12px; }

  /* ── KEY TAKEAWAY CARD ────────────────────────────────────────────────── */
  .takeaway-list { display: flex; flex-direction: column; gap: 12px; margin: 24px 0; }
  .takeaway-item {
    background: var(--bg-card); border: 1px solid var(--border);
    border-left: 3px solid var(--green);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 16px 20px; font-size: 14px; line-height: 1.7;
  }
  .takeaway-item strong { color: var(--green); }

  /* ── VIDEO WRAP ──────────────────────────────────────────────────────── */
  /*
   * 로컬 .mp4/.mov: <video src="./videos/파일명.mp4"> 상대경로 사용
   * 외부 embed:     <iframe src="https://www.youtube.com/embed/VIDEO_ID">
   * ❌ 절대경로(file:// 또는 C:\...) 금지  ❌ base64 금지
   * ✅ ./videos/ 상대경로 또는 YouTube/Drive embed
   */
  .video-wrap {
    border-radius: var(--radius); overflow: hidden;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    margin: 24px 0;
  }
  /* 로컬 video 태그 */
  .video-wrap video { width: 100%; display: block; background: #000; }
  /* iframe embed (16:9) */
  .video-wrap.iframe-wrap { position: relative; padding-top: 56.25%; }
  .video-wrap.iframe-wrap iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: 0;
  }
  .video-caption {
    font-size: 12px; color: var(--text-muted);
    padding: 10px 4px; margin-top: -16px; margin-bottom: 24px;
  }

  /* ── FOOTER ───────────────────────────────────────────────────────────── */
  footer { padding: 48px 0; text-align: center; border-top: 1px solid var(--border); }
  .footer-logo { font-size: 13px; font-weight: 700; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
  .footer-note { font-size: 12px; color: var(--text-muted); }

  /* ── RESPONSIVE ───────────────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .container { padding: 0 20px; }
    nav { padding: 14px 20px; }
    .hero { padding: 80px 0 60px; min-height: 420px; }
    .problem-grid { grid-template-columns: 1fr; }
    .insight-box  { flex-direction: column; gap: 24px; }
    .hero-meta-row { gap: 20px; }
  }
</style>
